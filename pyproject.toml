[project]
name = "tender-intel"
version = "0.1.0"
description = "Compilador de editais de fomento para grafo normativo verificável."
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["pypdf>=5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
tender-intel = "tender_intel.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
